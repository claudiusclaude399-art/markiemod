<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chess Coach</title>
    <style>
      body {
        margin: 0;
        width: 280px;
        background: #262421;
        color: #e8e6e3;
        font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h1 span {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: #81b64c;
        display: grid;
        place-items: center;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      button {
        background: #81b64c;
        color: #fff;
        border: 0;
        border-radius: 7px;
        padding: 9px;
        font: 600 13px system-ui, sans-serif;
        cursor: pointer;
        box-shadow: 0 3px 0 #45753c;
      }
      .here {
        background: #312e2b;
        border-radius: 7px;
        padding: 8px 10px;
      }
      ul {
        margin: 0;
        padding-left: 18px;
        color: #c9c7c3;
      }
      small {
        color: #a7a6a2;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1><span>&#9822;</span> Chess Coach</h1>
      <label><input type="checkbox" id="enabled" /> Show the coach on chess.com</label>
      <div class="here" id="here">Checking this tab&hellip;</div>
      <button id="board">Open offline board</button>
      <div>
        <small>Works on:</small>
        <ul>
          <li>chess.com Analysis &amp; Game Review</li>
          <li>chess.com games vs computer bots</li>
          <li>The offline board (any position)</li>
        </ul>
        <small>It stays off in live and daily games against people.</small>
      </div>
    </div>
    <script src="../shared/allow.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
