name: build-pc-usage-limiter-exe

on:
  push:
    paths:
      - "pc-usage-limiter/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the prebuilt exe as a release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc-usage-limiter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pystray Pillow keyboard

      - name: Build single-file exe
        run: >
          python -m PyInstaller
          --name PCUsageLimiter
          --onefile
          --noconsole
          --paths src
          --hidden-import pystray._win32
          --collect-all pystray
          --collect-all PIL
          src/main.py

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCUsageLimiter
          path: pc-usage-limiter/dist/PCUsageLimiter.exe

      - name: Publish prebuilt exe to a release (direct download link)
        if: github.ref == 'refs/heads/claude/exciting-wozniak-22pf92'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pcul-latest
          name: PC Usage Limiter (latest build)
          body: |
            Prebuilt Windows executable for the PC Usage Limiter.
            Download **PCUsageLimiter.exe** below and double-click it — no Python needed.
            Windows SmartScreen may warn about the unsigned app: click **More info -> Run anyway**.
          files: pc-usage-limiter/dist/PCUsageLimiter.exe
