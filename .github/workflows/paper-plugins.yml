name: paper-plugins

on:
  push:
    paths:
      - 'paper-plugins/**'
      - '.github/workflows/paper-plugins.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper-plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GriefCheck
          path: paper-plugins/GriefCheck/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: AdminGuard
          path: paper-plugins/AdminGuard/build/libs/*.jar
