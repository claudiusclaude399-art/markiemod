name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4   # only for jni.h / jni_md.h
        with:
          distribution: temurin
          java-version: 21

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/markiemod.dll dist/
          Copy-Item build/Release/injector.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: markiemod
          path: dist/
