// Builds both Paper plugins. Run: gradle build  -> */build/libs/*.jar
subprojects {
    apply plugin: 'java'

    group = 'dev.markiemod'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven { name = 'papermc'; url = 'https://repo.papermc.io/repository/maven-public/' }
    }

    dependencies {
        compileOnly "io.papermc.paper:paper-api:${rootProject.paper_version}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        options.compilerArgs += ['-Xlint:deprecation', '-Xlint:removal']
    }

    processResources {
        inputs.property 'version', project.version
        filesMatching('plugin.yml') { expand 'version': project.version }
    }

    jar { archiveFileName = "${project.name}-${project.version}.jar" }
}
